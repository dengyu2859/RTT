
gpu: 0
dataset: SpeechCommands
num_classes: 35
model: speech
epochs: 30
attack_target: 0
back_target: 0
tigger_pre: 0
pre_model: 0
attack_type: "Following_Nature"
a: 1.0
attack: 0
malicious: []
clients: 10
local_bs: 64
bs: 64
lr: 0.01
momentum: 0.9
local_ep: 5
temperature: 3.0
distill_lr: 0.001
distill_ep: 5
distill_num: 0.6
distill_momentum: 0.9
# 可选 mean、FedDF、DaFKD、Trimmed、AFA、Krum、FedTGD、ExpGuard、SelectiveFD、RLA
aggregation: mean
S: 5
beta: 0.3
artificial_trigger_strength: 1.0  # 仅人工触发测试：0 原样；1 覆盖；>1 外推；不裁剪
target_prob: 0.5
logit_solver: adam       # adam: 原迭代求解；closed_form: 闭式最优解
logit_update_mode: full  # full: 优化全部 logits；target_only: 仅优化目标类别
use_global_feedback: true  # false: 每轮增加 up_margin_step，并取消全局匹配损失
adaptive_margin: true    # 仅全局反馈开启时生效：true 自适应；false 固定 margin
desired_margin: 50       # 初始 margin；开启全局反馈且关闭自适应时为固定值
up_margin_step: 20       # 每次增加的差距
down_margin_step: 25     # 每次减少的差距
seed: 20250927

# 新增防御参数；仅 aggregation 选择对应防御时生效。
# FedTGD/SelectiveFD 的适配说明见 src/defense_notes.txt。
defense:
  probability_temperature: 1.0
  chunk_size: 256
  fedtgd:
    top_k: 3
    eps: 0.5
    min_samples: 5
    cosine_threshold: 0.5
  rla:
    n_clusters: 2  # 谱聚类簇数；最大簇用于估计良性中心
  expguard:
    eta: 1.0
  selective_fd:
    server_threshold: 1.0
